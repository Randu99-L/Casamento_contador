<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Permissão para carregar em iFrames como o Canva -->
  <meta http-equiv="X-Frame-Options" content="ALLOWALL">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: 'Montserrat', sans-serif;
      color: #6C8EBF;
      overflow: hidden;
    }
    .timer {
      display: flex;
      gap: 20px;
      text-align: center;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 55px;
    }
    .num {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="timer">
    <div class="box"><span class="num" id="dias">00</span><span class="label">Dias</span></div>
    <div class="box"><span class="num" id="horas">00</span><span class="label">Horas</span></div>
    <div class="box"><span class="num" id="min">00</span><span class="label">Min</span></div>
    <div class="box"><span class="num" id="sec">00</span><span class="label">Seg</span></div>
  </div>

  <script>
    const dataCasamento = new Date("2026-12-12T19:00:00").getTime();

    function atualizarContador() {
      const agora = new Date().getTime();
      const dif = dataCasamento - agora;

      if (dif > 0) {
        const d = Math.floor(dif / (1000 * 60 * 60 * 24));
        const h = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((dif % (1000 * 60)) / 1000);

        document.getElementById("dias").innerText = String(d).padStart(2, '0');
        document.getElementById("horas").innerText = String(h).padStart(2, '0');
        document.getElementById("min").innerText = String(m).padStart(2, '0');
        document.getElementById("sec").innerText = String(s).padStart(2, '0');
      }
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();
  </script>
</body>
</html>
