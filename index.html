<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
      color: #4A4A4A; /* Altere para a cor do seu texto */
    }
    .timer {
      display: flex;
      gap: 15px;
      text-align: center;
    }
    .box {
      display: flex;
      flex-direction: column;
    }
    .num {
      font-size: 2rem;
      font-weight: bold;
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="timer">
    <div class="box"><span class="num" id="dias">00</span><span class="label">Dias</span></div>
    <div class="box"><span class="num" id="horas">00</span><span class="label">Horas</span></div>
    <div class="box"><span class="num" id="min">00</span><span class="label">Min</span></div>
    <div class="box"><span class="num" id="sec">00</span><span class="label">Seg</span></div>
  </div>

  <script>
    const dataCasamento = new Date("2026-12-31T19:00:00").getTime(); // COLOQUE SUA DATA AQUI (ANO-MÊS-DIA)

    setInterval(() => {
      const agora = new Date().getTime();
      const dif = dataCasamento - agora;

      if (dif > 0) {
        document.getElementById("dias").innerText = Math.floor(dif / (1000 * 60 * 60 * 24));
        document.getElementById("horas").innerText = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("min").innerText = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("sec").innerText = Math.floor((dif % (1000 * 60)) / 1000);
      }
    }, 1000);
  </script>
</body>
</html>
